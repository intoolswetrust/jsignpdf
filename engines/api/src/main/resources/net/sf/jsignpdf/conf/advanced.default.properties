# Bundled defaults for the advanced JSignPdf configuration.
# These values are the in-jvm fallback when the user has not set the
# corresponding key in <cfg>/advanced.properties, and the source for the
# Preferences dialog "Reset to defaults" action.
#
# DO NOT edit at runtime. User overrides live in <cfg>/advanced.properties.

# Identifier of the signing engine used by default. Use --list-engines to see
# the available identifiers. The user-config file <cfg>/advanced.properties may
# override this, and the CLI --engine flag overrides it for a single invocation.
engine=openpdf

# When true, JSignPdf logs verbose diagnostics during signing (FINE level): the
# signing certificate chain, the loaded trust anchors, and every TSA / AIA / CRL
# / OCSP network call the DSS engine makes. Off by default; enable it to
# investigate a signing failure. The CLI -q / --quiet flag silences all output
# regardless of this setting.
debug=false

# How the signing intermediates are buffered.
#   memory (default) - everything on the Java heap; fastest, bounded by -Xmx and
#                      by a 2 GB staged-output limit in the openpdf engine.
#   temp             - intermediates go to temporary files; needed for very large
#                      documents, costs disk I/O and free space (roughly 1x the
#                      document size for openpdf, 2-3x for dss).
# The output bytes are the same either way; only the staging location changes.
buffering.mode=memory

# Directory for those temporary files. Empty = java.io.tmpdir. Point this at a
# fast local disk with enough free space when signing very large documents. It
# must already exist and be writable; JSignPdf does not create it. Read only
# when buffering.mode=temp.
# Note: the dss engine also writes PDF scratch files that the DSS library always
# puts in java.io.tmpdir, with no setting to move them. If /tmp is a RAM-backed
# tmpfs, add -Djava.io.tmpdir=<dir> via JAVA_OPTS as well.
buffering.tempDir=

# BCP-47 language tag of the user interface (e.g. de, fr, pt, zh-CN). Empty (the
# default) follows the operating-system locale. Read once at startup; restart
# JSignPdf to apply a change. The GUI Preferences dialog writes this key; on the
# CLI use -o ui.language=<tag>.
ui.language=

# Engine-specific configuration. Each engine module reads its own keys under the
# engine.<id>.* prefix (via EngineConfig). No keys are defined for the bundled
# OpenPDF engine

# Path to a TTF/OTF font used to render the visible signature L2 text.
# Empty value -> JSignPdf uses the bundled DejaVuSans font.
font.path=

# Font name used when calling OpenPDF BaseFont.createFont. Empty value ->
# basename of font.path is used; falls back to the bundled font name.
font.name=

# Font encoding. Allowed: Cp1250, Cp1252, Cp1257, Identity-H, Identity-V,
# MacRoman. Empty -> WINANSI when font.path is set, Identity-H for the
# bundled DejaVuSans.
font.encoding=

# When true, expired or not-yet-valid certificates are filtered from the
# alias list.
certificate.checkValidity=true

# When true, only certificates whose KeyUsage includes digitalSignature
# or nonRepudiation are listed.
certificate.checkKeyUsage=true

# When true, certificates with critical extensions outside JSignPdf's
# known set (KeyUsage, SubjectAltName, BasicConstraints, CertificateIssuer,
# ExtendedKeyUsage) are rejected.
certificate.checkCriticalExtensions=false

# When true, hostname verification is disabled and all server certificates
# are trusted for TSA / OCSP / CRL traffic. Use only on trusted networks.
relax.ssl.security=false

# Comma-separated, ordered list of preview backends. The first library
# that succeeds is used. pdfbox is first because it preserves page
# geometry, which the signature placement relies on. Allowed tokens:
# jpedal, pdfbox, openpdf.
pdf2image.libraries=pdfbox,jpedal,openpdf

# Target raster resolution (DPI) for the visible-signature preview. Higher
# is sharper but uses more memory; very large pages (e.g. A0 / CAD) are
# automatically rendered at a lower DPI to stay within a safe pixel budget.
preview.render.dpi=300

# Default hash algorithm requested when stamping a signature with a TSA
# (used when the signer options don't override it).
tsa.hashAlgorithm=SHA-256

# Suffix appended to the input file name to derive the default output file
# name (e.g. mydocument.pdf -> mydocument_signed.pdf). Used as the GUI
# suggestion and the fallback for the CLI -osuffix option. Set this to
# localize the marker (e.g. _signe, _firmado, _unterschrieben).
output.suffix=_signed

# Same, for the append-only document timestamp operation (--timestamp-only),
# which adds no signature (e.g. mydocument.pdf -> mydocument_timestamped.pdf).
# Set this to localize the marker (e.g. _horodate, _sellado).
output.suffix.timestamp=_timestamped

# DSS signing engine (PAdES). These knobs only matter when the 'dss' engine
# is selected and the requested PAdES level is LT/LTA (which embed revocation
# data). B and T work fully offline and ignore them.
#
# Fetch revocation data (OCSP/CRL) and intermediate certs (AIA) online.
# Required to produce LT/LTA. Default false keeps B/T fully offline.
engine.dss.online.enabled=false
# Use the bundled EU List Of Trusted Lists (LOTL) to build the trust anchors.
# Validates the LOTL signature against the bundled Official Journal (OJ) keystore.
engine.dss.trust.eu.enabled=false
# Optional overrides for the EU LOTL machinery (effective when trust.eu.enabled=true):
#   eu.lotlUrl          - relocate the default EU LOTL (default https://ec.europa.eu/tools/lotl/eu-lotl.xml)
#   eu.ojUrl            - Official Journal scheme-information URL for the announcement predicate
#   eu.ojKeystoreFile   - external OJ keystore overriding the bundled one
#   eu.ojKeystorePassword
engine.dss.trust.eu.lotlUrl=
engine.dss.trust.eu.ojUrl=
engine.dss.trust.eu.ojKeystoreFile=
engine.dss.trust.eu.ojKeystorePassword=
# Comma-separated lists of custom trust material (advanced).
engine.dss.trust.lotlUrls=
# Enable MRA processing for the custom lotlUrls (third-country mutual-recognition LOTLs,
# e.g. the eIDAS international pilot mra_lotl.xml). Off by default.
engine.dss.trust.lotlMraSupport=false
engine.dss.trust.certFiles=
engine.dss.trust.certUrls=
# Truststore holding trust anchors (type defaults to the JVM default).
engine.dss.trust.truststoreFile=
engine.dss.trust.truststoreType=
engine.dss.trust.truststorePassword=
# Also trust the OS / JVM root certificate stores available on this platform: cacerts
# everywhere, plus Windows-ROOT on Windows and KeychainStore on macOS. These are
# public-CA / OS roots, NOT eIDAS trusted-list anchors: they let LT/LTA embed
# validation data for commercially-issued (non-qualified) certificates but do not
# confer qualified status. Off by default.
engine.dss.trust.systemStore=false
# Advanced / private-PKI: downgrade DSS trust and revocation checks to warnings so
# LT/LTA completes for self-signed or otherwise untrusted signer chains that carry
# no revocation services. The produced file has the LT/LTA structure but NOT the
# revocation data a conformant long-term signature must embed, so strict validators
# will not accept it as LT/LTA. Testing / internal use only. Off by default.
engine.dss.trust.allowUntrusted=false
#
# Bytes reserved in the PDF /Contents for the CMS signature. 0 (default) sizes
# it automatically from the certificate chain and options; set a positive value
# to force a fixed size. Raise it only if signing fails with a "signature size
# too small" error and retrying (below) is disabled.
engine.dss.contentSize=0
# Re-sign with a larger reservation if the reserved /Contents turns out too
# small. Enabled by default; each retry repeats signing (and refetches the TSA
# timestamp for level T and above).
engine.dss.retryOnUndersize=true
# Send a random nonce in the RFC 3161 timestamp request and require the TSA to
# echo it back (replay protection). On by default. Turn it off only for a TSA
# that rejects or mishandles nonced requests. The openpdf engine always sends a
# nonce and ignores this key.
engine.dss.tsa.nonce=true
