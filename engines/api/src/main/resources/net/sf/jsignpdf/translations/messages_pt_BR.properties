hlp.certLevel=nível de certificação. O valor padrão é NOT_CERTIFIED. Os valores disponíveis são {0}
hlp.contact=detalhes de contato do signatário (um campo de assinatura)
hlp.disableScrRead=negar leitores de tela em documentos criptografados
hlp.enableStdinPasswords=permite ler valores de senha da entrada padrão. Quando ativado, o valor '-' de uma opção de senha significa: ler uma linha da entrada padrão (ou solicitar no console). Várias opções de senha podem usar '-' e são lidas na ordem fixa: --keystore-password, --key-password, --owner-password, --user-password, --tsa-cert-password, --tsa-password.
hlp.encryption=modo de criptografia para a saída PDF, o valor padrão é NONE. Os valores possíveis são {0}. Use em conjunto com -upwd e -opwd no caso do modo PASSWORD e -ec em caso de CERTIFICADO
hlp.footer.examples=Exemplos:\n---------\n$ jsignpdf -kst WINDOWS-MY mydocument.pdf\n-> cria cópia do mydocument.pdf com o nome mydocument_signed.pdf, assinado digitalmente com o primeiro certificado encontrado no certificado armazenado padrão do sistema operativo\n------------\njsignpdf -kst PKCS12 -ksf my_certificate.pfx -ksp myPrivateKeystorePassword -ka cert23 -pe PASSWORD -opwd xxx123 -upwd 123xxx -pr DISALLOW_PRINTING mydocument.pdf\n-> cria ficheiro assinado e encriptado mydocument_signed.pdf, a impressão do novo ficheiro não é permitida. Para assinatura é utilizada chave com o apelido cert23 do ficheiro my_certificate.pfx\n------------\n$ jsignpdf -lkt\n-> lista os tipos de armazenamento de chaves\n------------\n$ jsignpdf -kst PKCS12 -ksf my_certificate.pfx -ksp myVeryPrivatePassword -lk -q\n-> lista nomes (aliases) de chaves armazenadas no ficheiro my_certificate.pfx utilizando a palavra-passe para keystore. O modo silencioso é ativado para que nenhuma informação de depuração seja impressa.
hlp.footer.exitCodes=Códigos de saída do programa:\n-------------------\n  0 concluído sem erros\n  1 linha de comando inválida\n  2 nenhuma operação solicitada, por exemplo, nenhum arquivo para assinar\n  3 falha ao assinar alguns arquivos\n  4 falha ao assinar todos os arquivos\n  5 arquivo de entrada ilegível\n  6 erro geral
hlp.hashAlgorithm=algoritmo de hash usado para assinatura. O valor padrão é SHA1. Os valores disponíveis são {0}
hlp.help=imprime esta tela de ajuda
hlp.keyPwd=senha da chave no armazenamento de chaves. Na maioria dos casos, você não precisa definir esta opção - apenas o armazenamento de chaves é protegido por uma senha, mas apenas neste caso :) Use '-' para ler da entrada padrão (requer --enable-stdin-passwords).
hlp.ksFile=define o ficheiro KeyStore - como o valor, use o caminho no qual está o ficheiro com a(s) chave(s) privada(s) localizada(s) (.p12, .pfx, .jks, ...). Alguns armazenamentos de chaves não têm chaves armazenadas em um ficheiro (por exemplo, keystore do Windows - WINDOWS-MY), então não use esta opção.
hlp.ksPwd=senha para KeyStore. Use '-' para ler da entrada padrão (requer --enable-stdin-passwords).
hlp.l2TextFontSize=tamanho da fonte para texto de assinatura visível, o valor padrão é {0}
hlp.loadProperties=Carrega propriedades de um ficheiro padrão (criado pela aplicação GUI).
hlp.loadPropertiesFile=Carrega propriedades do ficheiro fornecido. O ficheiro pode ser criado copiando o ficheiro de propriedades padrão .JSignPdf criado pela GUI no diretório inicial do utilizador.
hlp.option=define uma chave de advanced.properties para esta invocação (substitui o arquivo de configuração). Repetível.
hlp.location=localização de uma assinatura (por exemplo, Washington DC). Vazio por padrão.
hlp.ocspServerUrl=URL do servidor OCSP padrão, que será usado caso o certificado de assinatura não contenha essas informações
hlp.outPath=pasta em que os documentos assinados serão armazenados. O valor padrão é a pasta atual.
hlp.outPrefix=prefixo para ficheiro assinado. O valor padrão é o prefixo vazio.
hlp.outSuffix=sufixo para nome de ficheiro assinado. O valor padrão é "{0}". (por exemplo, processo de assinatura no ficheiro mydocument.pdf criará um novo ficheiro mydocument{0}.pdf)
hlp.ownerpwd=senha do proprietário para documentos criptografados (usada quando a opção -e é fornecida). Use '-' para ler da entrada padrão (requer --enable-stdin-passwords).
hlp.page=página com assinatura visível. O valor padrão é 1 (primeira página). Se o número da página fornecido estiver fora dos limites, a última página será usada.
hlp.printRight=direitos de impressão. Usado para documentos criptografados. O valor padrão é ALLOW_PRINTING. Os valores disponíveis são {0}
hlp.proxyPort=porta do servidor proxy, o valor padrão é {0}
hlp.proxyType=tipo de proxy para conexões de internet. O valor padrão é {0}. Os valores possíveis são {1}
hlp.signerName=nome do signatário. O padrão é o nome comum (CN) do certificado escolhido.
hlp.sigField=assina em um campo de assinatura vazio existente, em vez de criar outro. O valor pode ser o nome do campo, "#N" para o campo de assinatura número N na ordem do documento (consulte -lsf) ou "auto" para o primeiro campo vazio. São usados a página e o retângulo do próprio campo, portanto as opções de posição são ignoradas, e a aparência é exibida mesmo sem -V.
hlp.reason=razão da assinatura. Vazio por padrão.
hlp.renderMode=modo de renderização para assinaturas visíveis. O valor padrão é DESCRIPTION_ONLY. Os valores possíveis são {0}
hlp.tsaAuthn=método de autenticação usado ao entrar em contato com o servidor TSA. O valor padrão é NONE. Os valores possíveis são {0}
hlp.tsaCertFileType=tipo de armazenamento de chaves para autenticação do CERTIFICADO TSA - o padrão é PKCS12
hlp.tsaCertPasswd=senha usada para abrir o ficheiro PKCS#12 (ver opção -tscf) com uma chave privada. Use '-' para ler da entrada padrão (requer --enable-stdin-passwords).
hlp.tsaHashAlg=algoritmo de hash usado na consulta ao servidor de carimbo de tempo (TSA); o padrão é {0}
hlp.tsaPwd=Senha de usuário TSA. Use essa opção se você usar carimbo de tempo (-ts) e o servidor TSA exigir autenticação. Use '-' para ler da entrada padrão (requer --enable-stdin-passwords).
hlp.tsaUser=Nome de usuário TSA. Use essa opção se você usar carimbo de tempo (-ts) e o servidor TSA exigir autenticação.
hlp.userpwd=senha de usuário para documentos criptografados (usada quando a opção -e é fornecida). Use '-' para ler da entrada padrão (requer --enable-stdin-passwords).
extcsp.nohost=Não é possível conectar ao servidor de assinatura - host desconhecido {0}: {1}
extcsp.iohost=Não é possível conectar ao servidor de assinatura - erro de conexão: {0}
pdfEncryption.password=Senhas
serverAuthn.password=Nome de usuário / Senha
