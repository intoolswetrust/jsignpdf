jfx.gui.dialog.jpx.text=A pré-visualização de imagens JPEG 2000 requer um decodificador opcional que não é incluído no JSignPdf devido à sua licença separada. Baixá-lo agora do Maven Central? Ele é armazenado no seu diretório de configuração de usuário e reutilizado da próxima vez.
