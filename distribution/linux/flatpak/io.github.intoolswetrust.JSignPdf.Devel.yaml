# Builds flatpak from the git repo source

app-id: io.github.intoolswetrust.JSignPdf.Devel
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

command: jsignpdf

finish-args:
# Network is required for TSA (timestamps) functionality
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --share=network
  - --share=ipc
# Requires X11 to run
  - --socket=x11
# Access to smart cards and YubiKey via pcscd
  - --socket=pcsc
# Access to USB devices (for YubiKey)
  - --device=all

cleanup:
  - /etc/bash_completion.d
  - /include
  - /share/doc
  - /share/man

modules:
  - name: pcsc-lite
    # pcsc-lite 2.4+ is Meson-only; the autotools build is gone.
    buildsystem: meson
    cleanup:
      - /bin
      - /lib/pkgconfig
      - /lib/*.a
      - /lib/*.la
      - /sbin
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.1.tar.xz
        sha256: bfcfe38a20afc49849c6bf55325e38f449fc4b26d3923fdc32b969ae41a8741b
    # Older flatpak-builder does not pass --libdir, meson then picks lib64 and
    # opensc's configure cannot find libpcsclite.pc.
    build-options:
      libdir: /app/lib
    config-opts:
      - -Ddefault_library=shared
      - -Dlibsystemd=false
      - -Dpolkit=false

  - name: opensc
    sources:
      - type: archive
        url: https://github.com/OpenSC/OpenSC/releases/download/0.26.0/opensc-0.26.0.tar.gz
        sha256: 837baead45e1505260d868871056150ede6e73d35460a470f2595a9e5e75f82b
    config-opts:
      - --disable-static
      - --enable-pcsc
      - --enable-openssl
      - --disable-strict

  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh
      - mkdir -p ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/openjdk
      - cp -r /usr/lib/sdk/openjdk21/jvm/openjdk-21/legal/java.base/LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/openjdk/

  - name: jsignpdf
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/intoolswetrust/jsignpdf.git
        branch: master
      - maven-dependencies.json
      # Shared desktop file from parent directory
      - type: file
        path: ../jsignpdf.desktop
      - type: file
        path: jsignpdf-flatpak.in
      # Shared metainfo file from parent directory
      - type: file
        path: ../io.github.intoolswetrust.JSignPdf.metainfo.xml
      - type: file
        path: jsignpdf.png
    build-commands:
      - |
        . /usr/lib/sdk/openjdk21/enable.sh
        mvn -o clean install \
          -Dmaven.repo.local="$(pwd)/m2local" \
          -DskipTests \
          -Dmaven.javadoc.skip=true \
          -Dmaven.source.skip=true \
          -Dasciidoctor.skip=true
      - unzip -o distribution/target/jsignpdf-*-full.zip -d distro
      - mkdir -p ${FLATPAK_DEST}/share/jsignpdf
      - cp -r distro/jsignpdf-*/lib distro/jsignpdf-*/licenses ${FLATPAK_DEST}/share/jsignpdf/
      - install -Dm755 jsignpdf-flatpak.in ${FLATPAK_DEST}/bin/jsignpdf
      - sed 's/io\.github\.intoolswetrust\.JSignPdf/io.github.intoolswetrust.JSignPdf.Devel/g' jsignpdf.desktop | install -Dm644 /dev/stdin ${FLATPAK_DEST}/share/applications/io.github.intoolswetrust.JSignPdf.Devel.desktop
      - sed 's/io\.github\.intoolswetrust\.JSignPdf/io.github.intoolswetrust.JSignPdf.Devel/g' io.github.intoolswetrust.JSignPdf.metainfo.xml | install -Dm644 /dev/stdin ${FLATPAK_DEST}/share/metainfo/io.github.intoolswetrust.JSignPdf.Devel.metainfo.xml
      - install -Dm644 jsignpdf.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.intoolswetrust.JSignPdf.Devel.png
      - mkdir -p ${FLATPAK_DEST}/share/licenses/io.github.intoolswetrust.JSignPdf.Devel
      - cp -r distro/jsignpdf-*/licenses/* ${FLATPAK_DEST}/share/licenses/io.github.intoolswetrust.JSignPdf.Devel/
