handlers=java.util.logging.ConsoleHandler
.level=WARNING
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.SimpleFormatter.format=%4$s %5$s%6$s%n
# Levels: OFF, SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST, ALL
# Baseline level for normal runs (progress messages). The advanced-config
# 'debug=true' key (Preferences > General, or advanced.properties) raises this
# to FINE at startup to surface the signing diagnostics; -q / --quiet lowers it
# to OFF. See net.sf.jsignpdf.utils.AppConfig#applyDebugLogLevel.
net.sf.jsignpdf.level=INFO
